<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Memory Match Game Preview</title>
  <desc id="desc">Stylized card game board with score panel and cards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#121318"/>
      <stop offset="100%" stop-color="#0b0c10"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d2230"/>
      <stop offset="100%" stop-color="#161a24"/>
    </linearGradient>
    <linearGradient id="highlight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#84a9ff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#5ad8b5" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>
  <circle cx="110" cy="120" r="150" fill="#84a9ff" opacity="0.09"/>
  <circle cx="1060" cy="640" r="180" fill="#5ad8b5" opacity="0.08"/>

  <rect x="70" y="70" width="1060" height="610" rx="24" fill="#141722" stroke="#2a2f42"/>
  <rect x="95" y="95" width="700" height="95" rx="14" fill="#1b2030" stroke="#2f3650"/>
  <rect x="820" y="95" width="285" height="95" rx="14" fill="#1b2030" stroke="#2f3650"/>

  <text x="125" y="153" fill="#84a9ff" font-family="JetBrains Mono, monospace" font-size="24">MEMORY MATCH GAME</text>
  <text x="845" y="153" fill="#e8e8ed" font-family="Outfit, sans-serif" font-size="34" font-weight="600">Score: 24</text>

  <g>
    <rect x="120" y="230" width="150" height="150" rx="14" fill="url(#card)" stroke="#3a445f"/>
    <rect x="300" y="230" width="150" height="150" rx="14" fill="url(#card)" stroke="#3a445f"/>
    <rect x="480" y="230" width="150" height="150" rx="14" fill="url(#highlight)" opacity="0.38" stroke="#84a9ff"/>
    <rect x="660" y="230" width="150" height="150" rx="14" fill="url(#card)" stroke="#3a445f"/>

    <rect x="120" y="410" width="150" height="150" rx="14" fill="url(#card)" stroke="#3a445f"/>
    <rect x="300" y="410" width="150" height="150" rx="14" fill="url(#highlight)" opacity="0.38" stroke="#5ad8b5"/>
    <rect x="480" y="410" width="150" height="150" rx="14" fill="url(#card)" stroke="#3a445f"/>
    <rect x="660" y="410" width="150" height="150" rx="14" fill="url(#card)" stroke="#3a445f"/>
  </g>

  <rect x="840" y="230" width="250" height="330" rx="16" fill="#1a1f2e" stroke="#2f3650"/>
  <text x="870" y="285" fill="#8ea0cf" font-family="JetBrains Mono, monospace" font-size="22">Difficulty</text>
  <rect x="870" y="305" width="190" height="40" rx="10" fill="#22293d"/>
  <text x="930" y="332" fill="#e8e8ed" font-family="Outfit, sans-serif" font-size="23">Medium</text>
  <text x="870" y="395" fill="#8ea0cf" font-family="JetBrains Mono, monospace" font-size="22">Moves</text>
  <text x="870" y="435" fill="#e8e8ed" font-family="Outfit, sans-serif" font-size="44" font-weight="700">18</text>
  <text x="870" y="505" fill="#8ea0cf" font-family="JetBrains Mono, monospace" font-size="22">Timer</text>
  <text x="870" y="545" fill="#e8e8ed" font-family="Outfit, sans-serif" font-size="44" font-weight="700">01:42</text>
</svg>
