<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">NEU Gym Tracker Preview</title>
  <desc id="desc">Stylized dashboard mockup with occupancy chart and cards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111113"/>
      <stop offset="100%" stop-color="#0a0a0b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5ad8b5" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#7de6c8" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>
  <circle cx="1020" cy="100" r="170" fill="#5ad8b5" opacity="0.09"/>
  <circle cx="140" cy="690" r="190" fill="#5ad8b5" opacity="0.06"/>

  <rect x="70" y="70" width="1060" height="610" rx="24" fill="#151519" stroke="#2c2c34"/>
  <rect x="95" y="95" width="360" height="120" rx="14" fill="#1b1b20" stroke="#2f2f38"/>
  <rect x="475" y="95" width="300" height="120" rx="14" fill="#1b1b20" stroke="#2f2f38"/>
  <rect x="795" y="95" width="310" height="120" rx="14" fill="#1b1b20" stroke="#2f2f38"/>

  <rect x="95" y="245" width="710" height="410" rx="16" fill="#1a1a1f" stroke="#30303a"/>
  <rect x="825" y="245" width="280" height="410" rx="16" fill="#1a1a1f" stroke="#30303a"/>

  <text x="126" y="145" fill="#8e8e99" font-family="JetBrains Mono, monospace" font-size="24">CURRENT OCCUPANCY</text>
  <text x="126" y="188" fill="#e8e8ed" font-family="Outfit, sans-serif" font-size="46" font-weight="700">68%</text>
  <text x="505" y="145" fill="#8e8e99" font-family="JetBrains Mono, monospace" font-size="24">BEST TIME</text>
  <text x="505" y="188" fill="#e8e8ed" font-family="Outfit, sans-serif" font-size="42" font-weight="700">7:10 AM</text>

  <g filter="url(#glow)">
    <polyline points="125,580 225,520 325,540 425,420 525,430 625,360 725,310" fill="none" stroke="url(#accent)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <line x1="125" y1="610" x2="765" y2="610" stroke="#32323c" stroke-width="3"/>
  <line x1="125" y1="300" x2="125" y2="610" stroke="#32323c" stroke-width="3"/>

  <rect x="855" y="280" width="220" height="84" rx="10" fill="#20202a"/>
  <rect x="855" y="390" width="220" height="84" rx="10" fill="#20202a"/>
  <rect x="855" y="500" width="220" height="84" rx="10" fill="#20202a"/>
  <rect x="875" y="312" width="130" height="12" rx="6" fill="#5ad8b5" opacity="0.8"/>
  <rect x="875" y="422" width="95" height="12" rx="6" fill="#5ad8b5" opacity="0.7"/>
  <rect x="875" y="532" width="160" height="12" rx="6" fill="#5ad8b5" opacity="0.65"/>

  <text x="95" y="45" fill="#5ad8b5" font-family="JetBrains Mono, monospace" font-size="26">NEU GYM TRACKER</text>
</svg>
